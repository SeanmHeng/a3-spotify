<!--Load the profile on click-->
<button class="btn btn-light" (click)="loadInfo()">Load info about me</button>
<!--Show the name, picture and Spotify link once loaded-->
<h3>Logged in user: {{name}}</h3>
<img [src]="profile_pic" class="profile">
<p>
	<a class="btn btn-light" target="_blank" [href]="profile_link">Open profile on Spotify</a>
</p>
